# Tempamail.org — static site on Cloudflare Pages
#
# Site files live in ./public (not repo root) so .git is never uploaded.
#
# Dashboard settings:
#   Build command: (empty)
#   Build output directory: public
#   Deploy command: npx wrangler deploy   OR leave empty
#
# CLI: npx wrangler pages deploy ./public --project-name=tempamail-landing

name = "tempamail-landing"
compatibility_date = "2024-06-01"
pages_build_output_dir = "./public"

[assets]
directory = "./public"
