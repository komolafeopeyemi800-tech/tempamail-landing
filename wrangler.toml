# Tempamail.org — static site on Cloudflare Pages
#
# If your dashboard "Deploy command" is: npx wrangler deploy
#   → [assets] below makes that command succeed (uploads this folder).
#
# Best setup (no deploy command in dashboard):
#   Build command: empty | Output: . | Deploy command: empty
#
# CLI Pages deploy:
#   npx wrangler pages deploy . --project-name=tempamail-landing

name = "tempamail-landing"
compatibility_date = "2024-06-01"
pages_build_output_dir = "."

[assets]
directory = "."
